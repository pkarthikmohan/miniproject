<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini AI Assistant</title>
</head>
<body>
    <h2>🤖 Mini AI Assistant</h2>
    <input type="text" id="user_input" placeholder="Enter your prompt...">
    <button onclick="submitPrompt()">Submit</button>
    <div id="response"></div>

    <script>
        async function submitPrompt() {
            const user_input = document.getElementById("user_input").value;
            const responseDiv = document.getElementById("response");

            // Send user input to the backend for processing
            const res = await fetch('/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ prompt: user_input })
            });

            const data = await res.json();
            responseDiv.innerText = "AI Response: " + data.response;
        }
    </script>
</body>
</html>
